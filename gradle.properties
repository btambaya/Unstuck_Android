org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Voice (Talk mode) Cloudflare Worker proxy. Public endpoint — auth is per-request
# via the user's Supabase token; not a secret. Committed so release builds always
# include voice (a plain assembleRelease without this hides the Talk button —
# voiceConfigured() gates on VOICE_PROXY_URL being non-blank). Override per-build
# with -PvoiceProxyUrl=... if pointing at a different worker.
voiceProxyUrl=wss://unstuck-voice-proxy.justtesting6363.workers.dev
